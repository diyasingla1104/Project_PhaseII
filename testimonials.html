<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoreFit | Testimonials</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f7fa;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #816bff, #6753ff);
      padding: 20px;
      text-align: center;
      color: white;
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .testimonial-form {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      margin-bottom: 40px;
    }

    .testimonial-form h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #6e6bff;
    }

    .testimonial-form label {
      display: block;
      margin: 12px 0 6px;
      font-weight: 500;
    }

    .testimonial-form input, 
    .testimonial-form textarea {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
      transition: 0.2s;
    }

    .testimonial-form input:focus, 
    .testimonial-form textarea:focus {
      border-color: #8b6bff;
    }

    .testimonial-form button {
      display: block;
      margin: 20px auto 0;
      padding: 12px 25px;
      border: none;
      border-radius: 12px;
      background: #6b75ff;
      color: rgb(255, 255, 255);
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .testimonial-form button:hover {
      background: #ff3b3b;
    }

    .testimonials-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .testimonial-card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    .testimonial-card h3 {
      margin: 0 0 10px;
      color: #444;
    }

    .testimonial-card p {
      font-size: 14px;
      color: #555;
    }

    .testimonial-card img,
    .testimonial-card video {
      width: 100%;
      border-radius: 12px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <header>🔥 CoreFit Testimonials</header>

  <div class="container">
    <div class="testimonial-form">
      <h2>Share Your Experience 💬</h2>
      <form>
        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label for="review">Your Review</label>
        <textarea id="review" rows="4" placeholder="Write your experience..." required></textarea>

        <label for="photo">Upload a Photo</label>
        <input type="file" id="photo" accept="image/*">

        <label for="video">Upload a Video</label>
        <input type="file" id="video" accept="video/*">

        <button type="submit">Submit Testimonial</button>
      </form>
    </div>
  </div>
</body>
</html>
