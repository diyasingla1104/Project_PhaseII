<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CoreFit Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #FFD700;
      font-size: 36px;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      background-color: #ffffff;
      color: #000000;
    }

    .submit-btn {
      background-color: #FFD700;
      color: #000;
      font-weight: bold;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      transition: background-color 0.3s ease;
    }

    .submit-btn:hover {
      background-color: #e6c200;
    }

    .message {
      text-align: center;
      margin-top: 20px;
      font-size: 16px;
    }

    .message.success {
      color: #00FF99;
    }

    .message.error {
      color: #FF6666;
    }

    a {
      color: #FFD700;
      display: block;
      text-align: center;
      margin-top: 15px;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CoreFit Login</h1>
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>
    </div>
    <button class="submit-btn" id="loginBtn">Login</button>
    <div id="message" class="message"></div>
    <a href="registration.html">Don't have an account? Register here</a>
  </div>

  <script type="module">
    import { auth, db, isFirebaseConfigured } from "./firebase-config.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const messageEl = document.getElementById("message");

    if (!isFirebaseConfigured) {
      messageEl.textContent = "Firebase is not configured. Add your Firebase console config in firebase-config.js.";
      messageEl.className = "message error";
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        messageEl.textContent = "Please fill in both fields.";
        messageEl.className = "message error";
        return;
      }

      if (!isFirebaseConfigured || !auth || !db) {
        messageEl.textContent = "Firebase configuration is missing.";
        messageEl.className = "message error";
        return;
      }

      try {
        const credential = await signInWithEmailAndPassword(auth, email, password);
        const userDocRef = doc(db, "users", credential.user.uid);
        const userDoc = await getDoc(userDocRef);
        const profile = userDoc.exists() ? userDoc.data() : {};

        messageEl.textContent = "Login successful! Redirecting...";
        messageEl.className = "message success";

        sessionStorage.setItem("name", profile.name || "--");
        sessionStorage.setItem("email", profile.email || email);
        sessionStorage.setItem("phone", profile.phone || "--");
        sessionStorage.setItem("age", profile.age || "--");
        sessionStorage.setItem("gender", profile.gender || "--");
        sessionStorage.setItem("program", profile.program || "--");
        sessionStorage.setItem("weight", profile.weight || "--");
        sessionStorage.setItem("goal", profile.goal || "--");
        sessionStorage.setItem("domain", profile.domain || "--");

        setTimeout(() => {
          window.location.href = "home.html";
        }, 1200);
      } catch (error) {
        messageEl.textContent = error.message || "Login failed";
        messageEl.className = "message error";
      }
    });
  </script>

</body>
</html>
